<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ModelRoute 面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
        --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system,"PingFang SC",sans-serif; padding:16px; }
h1 { font-size:16px; margin-bottom:4px; }
.sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns: 1fr 1.4fr; gap:14px; align-items:start; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:14px; }
.card h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.card h3 { font-size:11px; color:var(--dim); margin:10px 0 6px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:var(--dim); text-align:left; font-weight:normal; padding:3px 6px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:3px 6px; border-bottom:1px solid #21262d; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.badge { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; }
.badge.dead { background:#3d1618; color:var(--red); }
.badge.ok   { background:#12261e; color:var(--green); }
#feed { max-height:380px; overflow-y:auto; }
.feed-row { display:flex; gap:8px; padding:4px 0; border-bottom:1px solid #21262d; font-variant-numeric:tabular-nums; }
.feed-row .t { color:var(--dim); min-width:64px; }
.feed-row .m { color:var(--blue); min-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed-row .ms { margin-left:auto; color:var(--dim); }
.pill { border-radius:10px; padding:0 8px; font-size:11px; }
</style>
</head>
<body>
<h1>ModelRoute 路由面板</h1>
<div class="sub">本地智能路由网关 · <span id="sse-status">SSE 连接中…</span></div>
<div class="grid">
  <div>
    <div class="card">
      <h2>实时决策流</h2>
      <div id="feed"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>模型动态（有流量在前按流量排序，无流量按优先度）</h2>
      <table id="dyn"><thead>
        <tr><th>模型</th><th>链路</th><th>请求(成功)</th><th title="输入 tokens">入tok</th><th title="输出 tokens">出tok</th><th>平均TTFT</th><th>最近TTFT</th><th>平均耗时</th><th>最近耗时</th><th title="平均吐 token 速率（tokens/秒）">平均tok/s</th><th title="最近一次请求吐 token 速率（tokens/秒）">最近tok/s</th><th title="缓存读 tokens（折扣命中，不全价计费）">缓存读</th><th title="缓存写 tokens（计入计价）">缓存写</th><th>工具%</th></tr>
      </thead><tbody></tbody></table>
      <h3>冷却与配额窗口（上游限额头学习）</h3>
      <table id="health"><thead><tr><th>模型×key</th><th>状态</th><th>详情/冷却</th></tr></thead><tbody></tbody></table>
      <table id="quota" style="margin-top:8px"><thead><tr><th>模型×key</th><th>窗口</th><th>剩余</th><th>重置</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <h2>飞轮 · 经验学习与自进化（参与路由决策的因素）</h2>
      <table id="wheel"><thead>
        <tr>
          <th>模型</th>
          <th title="榜单能力分（coding/reasoning/agentic，0-100%）：来自内置策展快照或配置的外部榜单源（LMArena/SWE-bench/LiveBench 等），经别名置信度匹配后作为路由决策的能力先验">榜单c/r/a</th>
          <th title="实测可靠性 = 传输成功率 × 工具调用质量，再按会话语义确认与插件反馈融合（0-1，越高越可信）">rel</th>
          <th title="token 校准系数：实际 prompt tokens ÷ 估算值（≥5 个样本后学习），用于上下文窗口硬约束，防撑爆">calib</th>
          <th title="实测速度分（0-1）：由真实请求的平均总耗时对数衰减得出，与目录先验按 7:3 混合">speed</th>
          <th title="学习偏置：该模型实际成功率相对目录中位数的比值（0.7-1.3），表现好自动上浮、翻车下沉">bias</th>
          <th title="传输成功率（≥5 个样本后显示）">成功率</th>
          <th title="缓存命中率 = 缓存 tokens ÷ prompt tokens">缓存%</th>
          <th title="累计估算费用（按目录单价 × 累计 tokens，按厂商币种显示）">费用</th>
          <th title="飞轮样本量（请求数），学习项达到 5 个样本后才开始生效（冷启动保护）">样本</th>
          <th title="插件上报的工具执行反馈：ok/total（L4 最高精度信号）">反馈</th>
          <th title="最终权重 = 用户 weight × 学习偏置，开方软化后乘入评分——参与决策但非决定性">权重</th>
        </tr>
      </thead><tbody></tbody></table>
    </div>
  </div>
</div>
<script>
const feed = document.getElementById('feed');
function fmt(n){ return n==null ? '-' : n; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
// 不足 1000 不强制换算
function fmtK(n){ return n==null ? '-' : (n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n)); }
function fmtCost(n, cur){ if (n==null) return '-'; const sym = cur==='CNY' ? '¥' : '$'; return sym + (n>=100 ? n.toFixed(0) : n.toFixed(n<1 ? 3 : 2)); }
function fmtMs(ms){ return ms==null ? '-' : (ms >= 1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms'); }
function addRow(e){
  if (e.kind !== 'chat') return;
  const time = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const badge = (200<=e.status && e.status<300) ? 'ok' : 'dead';
  const tokens = fmtK(e.prompt_tokens ?? e.est_tokens) + '入 / ' + fmtK(e.completion_tokens ?? 0) + '出' +
    (e.cached_tokens ? ' 缓存读' + fmtK(e.cached_tokens) : '') +
    (e.cache_write_tokens ? ' 缓存写' + fmtK(e.cache_write_tokens) : '');
  const detail = esc(e.reason || '') +
    (e.funnel ? '<br>决策漏斗: ' + e.funnel.join(' → ') : '') +
    (e.filtered && e.filtered.length ? '<br>剔除: ' + e.filtered.map(function(f) { return esc(f.model + ' (' + f.cause + ')'); }).join('、 ') : '');
  const row = document.createElement('div');
  row.innerHTML = '<div class="feed-row" style="cursor:pointer">' +
    '<span class="t">' + time + '</span>' +
    '<span class="pill badge ' + badge + '">' + e.status + '</span>' +
    '<span class="m" title="' + esc(e.chosen) + '">' + esc(e.chosen) + '</span>' +
    '<span>' + tokens + '</span>' +
    (e.translated ? '<span class="sk" title="协议翻译">⇄' + esc(e.translated) + '</span>' : '') +
    (e.skipped ? '<span class="sk" title="降级链">↩' + esc(e.skipped) + '</span>' : '') +
    '<span class="ms">' + fmtMs(e.total_ms) + '</span>' +
    '</div><div class="feed-detail" style="display:none;padding:4px 12px;color:var(--dim);font-size:11px;border-left:2px solid var(--border);margin:2px 0 4px 8px">' + detail + '</div>';
  row.querySelector('.feed-row').addEventListener('click', function() {
    var d = row.querySelector('.feed-detail');
    if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  });
  feed.prepend(row);
  while (feed.children.length > 400) { if (feed.lastChild) feed.removeChild(feed.lastChild); }
}
function detail_placeholder(row) {
  // 返回归因链 detail div（放在 row 后面）
  // 这里只是占位——实际的 detail div 在 addRow 里拼入 row 后面
  return null;
}
const es = new EventSource('/api/stream');
es.onopen = () => document.getElementById('sse-status').textContent = 'SSE 已连接';
es.onerror = () => document.getElementById('sse-status').textContent = 'SSE 重连中…';
es.onmessage = ev => { try { addRow(JSON.parse(ev.data)); } catch(_){} };

const state = { stats:{}, bench:{}, health:{}, quota:{} };
async function refresh(){
  try {
    const [statsR, healthR, quotaR, benchR] = await Promise.all([
      fetch('/api/stats'), fetch('/api/health'), fetch('/api/quota'), fetch('/api/benchmarks')]);
    state.stats  = (await statsR.json()).models  || {};
    state.health = (await healthR.json()).models || {};
    state.quota  = (await quotaR.json()).windows || {};
    state.bench  = (await benchR.json()) || {};
    renderDyn();
    renderHealthQuota();
    renderWheel();
  } catch(_){}
}
function renderDyn(){
  const db = document.querySelector('#dyn tbody');
  const rows = Object.entries(state.stats).slice(0, 50).map(([id, s]) => {
    const keys = Object.keys(state.health).filter(k => k.split('\u001f')[0] === id);
    const link = keys.length === 0 ? '<span style="color:var(--dim)">-</span>'
      : (keys.some(k => state.health[k].available) ? '<span class="pill badge ok">up</span>'
         : '<span class="pill badge dead">down</span>');
    const tc = s.tool_calls || {};
    const toolRate = tc.total ? Math.round(100*(tc.valid_json/tc.total)) + '%' : '-';
    return `<tr><td title="${esc(id)}">${esc(id.length>34?id.slice(0,33)+'…':id)}</td>
      <td>${link}</td>
      <td class="num">${s.requests}(${s.success})</td>
      <td class="num">${fmtK(s.prompt_tokens??0)}</td>
      <td class="num">${fmtK(s.completion_tokens??0)}</td>
      <td class="num">${fmtMs(s.avg_ttft_ms)}</td>
      <td class="num">${fmtMs(s.last_ttft_ms)}</td>
      <td class="num">${fmtMs(s.avg_total_ms)}</td>
      <td class="num">${fmtMs(s.last_total_ms)}</td>
      <td class="num">${s.avg_rate_tok_s==null?'-':s.avg_rate_tok_s.toFixed(1)}</td>
      <td class="num">${s.last_rate_tok_s==null?'-':s.last_rate_tok_s.toFixed(1)}</td>
      <td class="num">${fmtK(s.cached_tokens||0)}</td>
      <td class="num">${fmtK(s.cache_write_tokens||0)}</td>
      <td class="num">${toolRate}</td></tr>`;
  });
  db.innerHTML = rows.join('') || '<tr><td colspan="14" style="color:var(--dim)">暂无流量</td></tr>';
}
function renderHealthQuota(){
  const hb = document.querySelector('#health tbody');
  const hentries = Object.entries(state.health);
  hb.innerHTML = hentries.length ? hentries.map(([id,h]) => `<tr>
    <td>${esc(id)}</td>
    <td><span class="pill badge ${h.available?'ok':'dead'}">${h.available?'可用':esc(h.kind)}</span></td>
    <td style="color:var(--dim)">${esc(h.message||'')}${h.cooldown_remaining_ms?` (${Math.round(h.cooldown_remaining_ms/1000)}s)`:''}</td></tr>`).join('')
    : '<tr><td colspan="3" style="color:var(--dim)">全部正常（无异常记录）</td></tr>';
  const qb = document.querySelector('#quota tbody');
  const qrows = Object.entries(state.quota).flatMap(([id, ws]) => (ws||[]).map(w => {
    const human = id.split('\u001f')[0] + (id.includes('\u001f') ? '['+id.split('\u001f')[1]+']' : '');
    const reset = w.reset_epoch_ms ? new Date(w.reset_epoch_ms).toLocaleTimeString('zh-CN',{hour12:false}) : '-';
    return `<tr><td>${esc(human)}</td><td>${esc(w.scope)}</td><td class="num">${fmtK(w.remaining)}</td><td class="num">${reset}</td></tr>`;
  }));
  qb.innerHTML = qrows.length ? qrows.join('') : '<tr><td colspan="4" style="color:var(--dim)">尚未观测到限额头</td></tr>';
}
function renderWheel(){
  const applied = state.bench.applied || {};
  const wb = document.querySelector('#wheel tbody');
  const entries = Object.entries(state.stats).sort((a,b) => {
    const ra = (b[1].requests||0) - (a[1].requests||0);
    if (ra !== 0) return ra;
    return (b[1].dynamic_score??0) - (a[1].dynamic_score??0);
  }).slice(0, 15);
  const rows = entries.map(([id, s]) => {
    const t = s.telemetry || {};
    const bt = (applied[id] || {}).tiers || {};
    const pct = x => x==null ? '-' : Math.round(x*100)+'%';
    const uw = s.user_weight ?? 1;
    const lb = t.learned_bias;
    const w = (uw === 1 && (lb == null || lb === 1)) ? '—' : uw.toFixed(2) + '×' + (lb ?? 1).toFixed(2);
    const fb = s.feedback || {ok:0,total:0};
    const sr = s.success_rate==null ? '-' : Math.round(s.success_rate*100)+'%';
    const chr = s.cache_hit_rate==null ? '-' : Math.round(s.cache_hit_rate*100)+'%';
    const cost = fmtCost(s.est_cost, s.currency);
    return `<tr><td title="${esc(id)}">${esc(id.length>32?id.slice(0,31)+'…':id)}</td>
      <td class="num">${pct(bt.coding)}/${pct(bt.reasoning)}/${pct(bt.agentic)}</td>
      <td class="num">${t.reliability==null?'-':t.reliability.toFixed(2)}</td>
      <td class="num">${t.calibration==null?'-':'×'+t.calibration.toFixed(2)}</td>
      <td class="num">${t.speed_obs==null?'-':t.speed_obs.toFixed(2)}</td>
      <td class="num">${t.learned_bias==null?'-':t.learned_bias.toFixed(2)}</td>
      <td class="num">${sr}</td>
      <td class="num">${chr}</td>
      <td class="num">${cost}</td>
      <td class="num">${s.samples??0}</td>
      <td class="num">${fb.ok}/${fb.total}</td>
      <td class="num">${w}</td></tr>`;
  });
  wb.innerHTML = rows.length ? rows.join('') : '<tr><td colspan="12" style="color:var(--dim)">飞轮经验积累中…</td></tr>';
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
