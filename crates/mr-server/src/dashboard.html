<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ModelRoute</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
        --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; padding:16px 20px; }
.topbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.topbar h1 { font-size:17px; }
.sub { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:6px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--amber); display:inline-block; }
.dot.ok { background:var(--green); } .dot.err { background:var(--red); }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
.chip { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2px 10px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
.chip b { color:var(--fg); font-weight:normal; }
.lang-sel { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:12px; padding:3px 8px; font-size:12px; cursor:pointer; }
.grid { display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; align-items:start; }
@media (max-width:1100px){ .grid { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
.card h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.card h2 .note { text-transform:none; letter-spacing:0; opacity:.75; margin-left:6px; }
.card h3 { font-size:11px; color:var(--dim); margin:12px 0 6px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:var(--dim); text-align:left; font-weight:normal; padding:4px 6px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:bottom; }
td { padding:4px 6px; border-bottom:1px solid #21262d; vertical-align:top; }
tbody tr:hover { background:#1c2129; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dim2 { color:var(--dim); font-size:11px; }
.badge { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; }
.badge.dead { background:#3d1618; color:var(--red); }
.badge.ok   { background:#12261e; color:var(--green); }
#feed { max-height:520px; overflow-y:auto; }
.feed-ev { border-bottom:1px solid #21262d; padding:3px 0; }
.feed-row { display:flex; gap:8px; padding:2px 0; font-variant-numeric:tabular-nums; cursor:pointer; align-items:baseline; }
.feed-row:hover { background:#1c2129; }
.feed-row .t { color:var(--dim); min-width:60px; font-size:11px; }
.feed-row .m { color:var(--blue); min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed-row .tk { font-size:11px; color:var(--dim); }
.feed-row .ms { margin-left:auto; color:var(--dim); }
.pill { border-radius:10px; padding:0 8px; font-size:11px; }
.feed-path { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; padding:2px 0 1px 2px; font-size:11px; color:var(--dim); }
.pbadge { border-radius:4px; padding:0 6px; background:#1c2431; color:var(--blue); white-space:nowrap; }
.pbadge.explore { color:var(--amber); }
.pbadge.warn { color:var(--red); background:#2d1a1c; }
.pdim { font-variant-numeric:tabular-nums; }
.feed-detail { padding:4px 12px; color:var(--dim); font-size:11px; border-left:2px solid var(--border); margin:3px 0 3px 8px; }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1 data-i18n="title">ModelRoute 路由面板</h1>
    <div class="sub"><span class="dot" id="sse-dot"></span><span id="sse-status" data-i18n="sse_conn">SSE 连接中…</span></div>
  </div>
  <div class="chips" id="chips"></div>
  <select class="lang-sel" id="lang-sel"></select>
</header>
<main>
  <section class="card">
    <h2 data-i18n="feed">实时决策流</h2>
    <div id="feed"></div>
  </section>
  <div class="grid">
    <section class="card">
      <h2><span data-i18n="dyn">模型动态</span><span class="note" data-i18n="dyn_note">有流量在前按流量排序，无流量按优先度</span></h2>
      <table id="dyn"><thead></thead><tbody></tbody></table>
      <h3 data-i18n="health">冷却与配额窗口（上游限额头学习）</h3>
      <table id="health"><thead></thead><tbody></tbody></table>
      <table id="quota" style="margin-top:8px"><thead></thead><tbody></tbody></table>
    </section>
    <section class="card">
      <h2 data-i18n="wheel">飞轮 · 经验学习与自进化（参与路由决策的因素）</h2>
      <table id="wheel"><thead></thead><tbody></tbody></table>
    </section>
  </div>
</main>

const t = k => (T[k] && (T[k][lang] ?? T[k].zh)) ?? k;

const feed = document.getElementById('feed');
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtK(n){ return n==null ? '-' : (n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1000 ? (n/1000).toFixed(1)+'k' : String(n)); }
function fmtCost(n, cur){ if (n==null) return '-'; const sym = cur==='CNY' ? '¥' : '$'; return sym + (n>=100 ? n.toFixed(0) : n.toFixed(n<1 ? 3 : 2)); }
function fmtMs(ms){ return ms==null ? '-' : (ms>=10000 ? (ms/1000).toFixed(0)+'s' : ms>=1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms'); }
function fmtRate(r){ return r==null ? '-' : r.toFixed(1); }
function timeStr(d){ return d.toLocaleTimeString(LOCALE[lang], {hour12:false}); }
function feedTokens(e){
  let s = fmtK(e.prompt_tokens ?? e.est_tokens)+t('s_in')+' '+fmtK(e.completion_tokens ?? 0)+t('s_out');
  if (e.cached_tokens)      s += ' · '+t('s_incl')+fmtK(e.cached_tokens);
  if (e.cache_write_tokens) s += ' · '+t('s_write')+fmtK(e.cache_write_tokens);
  return s;
}

function srcLine(e){
  const agent = (e.agent||'').replace(/\/.*$/, '');
  if (!agent && !e.session) return '';
  return '<span class="dim2">'+esc(t('c_source'))+':</span> '+esc(agent + (agent && e.session ? ' · ' : '') + (e.session||''));
}
function judgeBadge(e){
  const map = {'decision_model':'bj_model', 'decision_model+rules':'bj_hybrid', 'heuristic':'bj_heur', 'explicit':'bj_explicit'};
  const k = map[e.judge];
  return k ? '<span class="pbadge" title="'+esc(t('t_'+k))+'">'+esc(t(k))+'</span>' : '';
}
function decisionPath(e){
  const parts = [];
  if (e.skipped) parts.push('<span class="pbadge warn" title="'+t('skipped')+'">↩ '+esc(e.skipped)+'</span>');
  if (e.sticky) {
    parts.push('<span class="pbadge" title="'+esc(t('p_sticky_hint'))+'">'+esc(t('p_sticky'))+'</span>');
  } else {
    parts.push(judgeBadge(e));
    if ((e.reason||'').includes('[exploring]'))
      parts.push('<span class="pbadge explore" title="'+esc(t('t_explore'))+'">'+esc(t('p_explore'))+'</span>');
    const f = e.funnel || [];
    if (f.length === 4 && f.some(x => x > 0)) {
      const tip = t('t_funnel').replace('{a}',f[0]).replace('{b}',f[1]).replace('{c}',f[2]).replace('{d}',f[3]);
      parts.push('<span class="pdim" title="'+esc(tip)+'">'+esc(t('p_funnel'))+' '+f.join('→')+'</span>');
    }
    if (e.difficulty_eff != null)
      parts.push('<span class="pdim" title="'+esc(t('t_diff'))+'">'+esc(t('p_diff'))+' '+(+e.difficulty_eff).toFixed(1)+'</span>');
  }
  const alts = (e.chain || []).filter(m => m !== e.chosen).slice(0, 2);
  if (alts.length) parts.push('<span class="pdim" title="'+esc(t('p_alt'))+'">'+esc(t('p_alt'))+' '+alts.map(a => esc(a.length>22?a.slice(0,21)+'…':a)).join(' ▸ ')+'</span>');
  if (e.est_tokens) parts.push('<span class="pdim" title="'+esc(t('t_est'))+'">'+esc(t('p_est'))+' '+fmtK(e.est_tokens)+' tok</span>');
  return parts.join('');
}
function shortId(m){ return m.length>26 ? m.slice(0,25)+'…' : m; }
function causeLocal(c){
  const paren = s => lang==='zh'||lang==='ja'||lang==='ko' ? '（'+s+'）' : '('+s+')';
  let m;
  if (c === 'no credential') return t('ca_cred');
  if (c === 'no vision support') return t('ca_vision');
  if (c === 'context window too small') return t('ca_window');
  if ((m = c.match(/^unknown context window \(proven max accepted (\d+) tok\)$/)))
    return t('ca_proven').replace('{n}', fmtK(+m[1]));
  if ((m = c.match(/^quota remaining (\d+) < est (\d+)$/)))
    return t('ca_quota').replace('{a}', fmtK(+m[1])).replace('{b}', fmtK(+m[2]));
  if ((m = c.match(/^(auth failed|no credit|quota exhausted|rate limited|model unsupported|context overflow|transient error)(?: for (\d+)s)? \((.*)\)$/))) {
    const hk = T['hk_'+m[1].replace(/ /g,'_')];
    let s = hk ? (hk[lang] ?? hk.zh) : m[1];
    if (m[2]) s += ' · ' + t('ca_cooldown').replace('{n}', m[2]);
    return s + paren(m[3]);
  }
  return c;
}
function decisionDetail(e){
  const L = [];
  const push = h => L.push('<div style="margin:1px 0">· '+h+'</div>');
  L.push('<b>'+t('st_why')+' '+esc(shortId(e.chosen))+(lang==='zh'?'？':'?')+'</b>');
  if (e.sticky) {
    push(esc(t('st_sticky_1')));
    push(esc(t('st_sticky_2').replace('{n}', fmtK(e.est_tokens||e.prompt_tokens||0))));
    push(esc(t('st_sticky_3')));
  } else {
    const bym = {'decision_model':'st_by_model', 'decision_model+rules':'st_by_hybrid', 'heuristic':'st_by_heur', 'explicit':'st_by_explicit'}[e.judge];
    if (bym) push(esc(t(bym)));
    const dm = (e.reason||'').match(/domain=(\w+)/);
    if (dm) {
      const dk = T['dom_'+dm[1]];
      const diff = +e.difficulty_eff || 0;
      const dw = diff < 1 ? t('diff_low') : diff < 2 ? t('diff_mid') : t('diff_high');
      push(esc(t('st_task').replace('{d}', dk ? (dk[lang] ?? dk.zh) : dm[1]).replace('{w}', dw).replace('{v}', diff.toFixed(1))));
    }
    const f = e.funnel || [];
    if (f.length === 4 && f[0] > 0)
      push(esc(f[1] === f[2] ? t('st_hard_pass').replace('{n}', f[2]) : t('st_hard_some').replace('{a}', f[1]).replace('{b}', f[2])));
    const sc = Object.entries(e.scores||{}).sort((a,b) => b[1]-a[1]);
    const mine = sc.find(([m]) => m === e.chosen);
    if (mine) push(esc(t('st_score_top').replace('{s}', (+mine[1]).toFixed(2))));
    const second = sc.find(([m]) => m !== e.chosen);
    if (second) push(esc(t('st_second').replace('{m}', shortId(second[0])).replace('{s}', (+second[1]).toFixed(2))));
    if ((e.reason||'').includes('[exploring]')) push(esc(t('st_explore')));
  }
  if (e.filtered && e.filtered.length)
    push('<span style="color:var(--dim)">'+esc(t('st_filtered_head'))+'：' +
      e.filtered.map(f => esc(shortId(f.model))+'（'+esc(causeLocal(f.cause))+'）').join('、 ')+'</span>');
  L.push('<div style="opacity:.6;margin-top:3px">'+esc(t('p_session'))+': '+esc(e.session||'-')+'</div>');
  return L.join('');
}
function feedMetrics(e){
  const parts = [];
  parts.push('<span title="'+esc(t('t_actual'))+'">'+feedTokens(e)+'</span>');
  if (e.ttft_ms != null) parts.push('<span>TTFT '+fmtMs(e.ttft_ms)+'</span>');
  if (e.ttft_ms != null && e.total_ms > e.ttft_ms && (e.completion_tokens||0) > 0) {
    const rate = e.completion_tokens / ((e.total_ms - e.ttft_ms) / 1000);
    parts.push('<span title="'+esc(t('t_rate_f'))+'">'+rate.toFixed(1)+' tok/s</span>');
  }
  if ((e.prompt_tokens||0) > 0 && e.cached_tokens)
    parts.push('<span title="'+esc(t('t_cache_util'))+'">'+esc(t('f_cache_util'))+' '+Math.round(100*e.cached_tokens/e.prompt_tokens)+'%</span>');
  const tools = e.tools || [];
  const qc = ((e.quality||{}).tool_calls_total) || 0;
  if (tools.length) parts.push('<span title="'+esc(t('f_tools'))+'">'+esc(t('f_tools'))+': '+tools.map(x => esc(x.length>20?x.slice(0,19)+'…':x)).join(', ')+'</span>');
  else if (qc) parts.push('<span title="'+esc(t('f_tools'))+'">'+esc(t('f_tools'))+' ×'+qc+'</span>');
  return parts.join('<span class="dim2"> · </span>');
}
function addRow(e){
  if (e.kind !== 'chat') return;
  const badge = (200<=e.status && e.status<300) ? 'ok' : 'dead';
  const row = document.createElement('div');
  row.className = 'feed-ev';
  row.innerHTML = '<div class="feed-row">' +
    '<span class="t">'+timeStr(new Date())+'</span>' +
    '<span class="pill badge '+badge+'">'+e.status+'</span>' +
    '<span class="m" title="'+esc(e.chosen)+'">'+esc(e.chosen)+'</span>' +
    feedMetrics(e) +
    (e.translated ? '<span class="tk" title="'+t('translated')+'">⇄'+esc(e.translated)+'</span>' : '') +
    '<span class="ms">'+fmtMs(e.total_ms)+'</span></div>' +
    '<div class="feed-path">'+srcLine(e)+'</div>' +
    '<div class="feed-path">'+decisionPath(e)+'</div>' +
    '<div class="feed-detail" style="display:none">'+decisionDetail(e)+'</div>';
  row.querySelector('.feed-row').addEventListener('click', () => {
    const d = row.querySelector('.feed-detail');
    if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  });
  feed.prepend(row);
  while (feed.children.length > 200) { if (feed.lastChild) feed.removeChild(feed.lastChild); }
}

const state = { stats:{}, bench:{}, health:{}, quota:{} };

function tt(key){ const [k, sub] = key.split('.'); return sub && T[k] && T[k][sub] ? (T[k][sub][lang] ?? T[k][sub].zh) : t(key); }
function buildThead(table, cols){
  table.querySelector('thead').innerHTML = '<tr>' + cols.map(c =>
    '<th class="'+(c.num?'num':'')+'"'+(c.tk?' title="'+esc(tt(c.tk))+'"':'')+'>'+esc(t(c.k))+'</th>').join('') + '</tr>';
}
const DYN_COLS = [
  {k:'c_model'}, {k:'c_source', tk:'c_source._t'}, {k:'c_reqs', num:1},
  {k:'c_tokens', num:1, tk:'c_tokens._t'}, {k:'c_ttft', num:1, tk:'c_ttft._t'},
  {k:'c_lat', num:1, tk:'c_lat._t'}, {k:'c_rate', num:1, tk:'c_rate._t'},
  {k:'c_cache', num:1, tk:'c_cache._t'}, {k:'c_tools', num:1, tk:'c_tools._t'},
];
function renderDyn(){
  buildThead(document.getElementById('dyn'), DYN_COLS);
  const db = document.querySelector('#dyn tbody');
  const srcLabel = k => ({user:t('src_user'), discovered:t('src_disc'), remote:t('src_remote'), builtin:t('src_builtin')})[k] || k || '-';
  const rows = Object.entries(state.stats).slice(0, 50).map(([id, s]) => {
    const keys = Object.keys(state.health).filter(k => k.split('\u001f')[0] === id);
    const degraded = keys.length > 0 && !keys.some(k => state.health[k].available);
    const src = '<span'+(degraded?' style="color:var(--red)" title="⚠ '+esc(t('allnormal')).replace(/（.*/,'')+'"':'')+'>'+esc(srcLabel(s.source))+(degraded?' ⚠':'')+'</span>';
    const tc = s.tool_calls || {};
    const toolRate = tc.total ? Math.round(100*(tc.valid_json/tc.total))+'%' : '-';
    const tok = '<div title="'+esc(t('t_actual'))+'">'+fmtK(s.prompt_tokens??0)+t('s_in')+' '+fmtK(s.completion_tokens??0)+t('s_out')+'</div>' +
      '<div class="dim2" title="'+esc(t('t_actual'))+'">'+t('s_incl')+fmtK(s.cached_tokens||0)+' · '+t('s_write')+fmtK(s.cache_write_tokens||0)+'</div>';
    return '<tr><td title="'+esc(id)+'">'+esc(id.length>30?id.slice(0,29)+'…':id)+'</td>' +
      '<td>'+src+'</td>' +
      '<td class="num">'+s.requests+'('+s.success+')</td>' +
      '<td class="num">'+tok+'</td>' +
      '<td class="num">'+fmtMs(s.avg_ttft_ms)+'</td>' +
      '<td class="num">'+fmtMs(s.avg_total_ms)+'</td>' +
      '<td class="num">'+fmtRate(s.avg_rate_tok_s)+'</td>' +
      '<td class="num">'+(s.cache_hit_rate==null?'-':Math.round(s.cache_hit_rate*100)+'%')+'</td>' +
      '<td class="num">'+toolRate+'</td></tr>';
  });
  db.innerHTML = rows.join('') || '<tr><td colspan="9" style="color:var(--dim)">'+t('noflow')+'</td></tr>';
}
const HEALTH_COLS = [{k:'c_mk'},{k:'c_status'},{k:'c_detail'}];
const QUOTA_COLS  = [{k:'c_mk'},{k:'c_window'},{k:'c_remain',num:1},{k:'c_reset',num:1}];
function renderHealthQuota(){
  buildThead(document.getElementById('health'), HEALTH_COLS);
  buildThead(document.getElementById('quota'), QUOTA_COLS);
  const hb = document.querySelector('#health tbody');
  const hentries = Object.entries(state.health);
  hb.innerHTML = hentries.length ? hentries.map(([id,h]) => '<tr>' +
    '<td>'+esc(id)+'</td>' +
    '<td><span class="pill badge '+(h.available?'ok':'dead')+'">'+(h.available?t('available'):esc(h.kind))+'</span></td>' +
    '<td style="color:var(--dim)">'+esc(h.message||'')+(h.cooldown_remaining_ms?' ('+Math.round(h.cooldown_remaining_ms/1000)+'s)':'')+'</td></tr>').join('')
    : '<tr><td colspan="3" style="color:var(--dim)">'+t('allnormal')+'</td></tr>';
  const qb = document.querySelector('#quota tbody');
  const qrows = Object.entries(state.quota).flatMap(([id, ws]) => (ws||[]).map(w => {
    const human = id.split('\u001f')[0] + (id.includes('\u001f') ? '['+id.split('\u001f')[1]+']' : '');
    return '<tr><td>'+esc(human)+'</td><td>'+esc(w.scope)+'</td><td class="num">'+fmtK(w.remaining)+'</td><td class="num">'+(w.reset_epoch_ms?timeStr(new Date(w.reset_epoch_ms)):'-')+'</td></tr>';
  }));
  qb.innerHTML = qrows.length ? qrows.join('') : '<tr><td colspan="4" style="color:var(--dim)">'+t('noquota')+'</td></tr>';
}
const WHEEL_COLS = [
  {k:'c_model'},
  {k:'w_bench', num:1, tk:'w_bench._t'}, {k:'w_rel', num:1, tk:'w_rel._t'},
  {k:'w_calib', num:1, tk:'w_calib._t'}, {k:'w_speed', num:1, tk:'w_speed._t'},
  {k:'w_bias', num:1, tk:'w_bias._t'}, {k:'w_sr', num:1, tk:'w_sr._t'},
  {k:'w_cache', num:1, tk:'w_cache._t'}, {k:'w_cost', num:1, tk:'w_cost._t'},
  {k:'w_samples', num:1, tk:'w_samples._t'}, {k:'w_fb', num:1, tk:'w_fb._t'},
  {k:'w_weight', num:1, tk:'w_weight._t'},
];
function tt(key){ const [k, sub] = key.split('.'); return T[k] && T[k][sub] ? (T[k][sub][lang] ?? T[k][sub].zh) : key; }
function renderWheel(){
  buildThead(document.getElementById('wheel'), WHEEL_COLS);
  const applied = state.bench.applied || {};
  const wb = document.querySelector('#wheel tbody');
  const entries = Object.entries(state.stats).sort((a,b) => {
    const ra = (b[1].requests||0) - (a[1].requests||0);
    if (ra !== 0) return ra;
    return (b[1].dynamic_score??0) - (a[1].dynamic_score??0);
  }).slice(0, 15);
  const rows = entries.map(([id, s]) => {
    const tr = s.telemetry || {};
    const bt = (applied[id] || {}).tiers || s.tiers || {};
    const pct = x => x==null ? '-' : Math.round(x*100)+'%';
    const uw = s.user_weight ?? 1;
    const lb = tr.learned_bias ?? 1;
    const w = uw.toFixed(2)+'×'+lb.toFixed(2);
    const fb = s.feedback || {ok:0,total:0};
    return '<tr><td title="'+esc(id)+'">'+esc(id.length>28?id.slice(0,27)+'…':id)+'</td>' +
      '<td class="num">'+pct(bt.coding)+'/'+pct(bt.reasoning)+'/'+pct(bt.agentic)+'</td>' +
      '<td class="num">'+(tr.reliability==null?'-':tr.reliability.toFixed(2))+'</td>' +
      '<td class="num">'+(tr.calibration==null?'-':'×'+tr.calibration.toFixed(2))+'</td>' +
      '<td class="num">'+(tr.speed_obs==null?'-':tr.speed_obs.toFixed(2))+'</td>' +
      '<td class="num">'+(tr.learned_bias==null?'-':tr.learned_bias.toFixed(2))+'</td>' +
      '<td class="num">'+(s.success_rate==null?'-':Math.round(s.success_rate*100)+'%')+'</td>' +
      '<td class="num">'+(s.cache_hit_rate==null?'-':Math.round(s.cache_hit_rate*100)+'%')+'</td>' +
      '<td class="num">'+fmtCost(s.est_cost, s.currency)+'</td>' +
      '<td class="num">'+(s.samples??0)+'</td>' +
      '<td class="num">'+fb.ok+'/'+fb.total+'</td>' +
      '<td class="num">'+w+'</td></tr>';
  });
  wb.innerHTML = rows.length ? rows.join('') : '<tr><td colspan="12" style="color:var(--dim)">'+t('wheelcold')+'</td></tr>';
}
function renderChips(){
  const all = Object.values(state.stats);
  const reqs = all.reduce((a,s) => a+(s.requests||0), 0);
  const ok = all.reduce((a,s) => a+(s.success||0), 0);
  const byCur = {};
  all.forEach(s => { if (s.est_cost) byCur[s.currency||'USD'] = (byCur[s.currency||'USD']||0)+s.est_cost; });
  const cost = Object.entries(byCur).map(([c,v]) => fmtCost(v, c)).join(' · ') || '-';
  const active = all.filter(s => (s.requests||0) > 0).length;
  document.getElementById('chips').innerHTML =
    '<span class="chip">'+t('chip_reqs')+' <b>'+reqs+'</b>'+(reqs?' <b>'+Math.round(100*ok/reqs)+'%</b>':'')+'</span>' +
    '<span class="chip">'+t('chip_cost')+' <b>'+cost+'</b></span>' +
    '<span class="chip">'+t('chip_active')+' <b>'+active+'</b>/'+all.length+'</span>';
}

async function refresh(){
  try {
    const [statsR, healthR, quotaR, benchR] = await Promise.all([
      fetch('/api/stats'), fetch('/api/health'), fetch('/api/quota'), fetch('/api/benchmarks')]);
    state.stats  = (await statsR.json()).models  || {};
    state.health = (await healthR.json()).models || {};
    state.quota  = (await quotaR.json()).windows || {};
    state.bench  = (await benchR.json()) || {};
    renderChips();
    renderDyn();
    renderHealthQuota();
    renderWheel();
  } catch(_){}
}

const es = new EventSource('/api/stream');
const dot = document.getElementById('sse-dot');
let sseState = 'conn';
function updateSse(){
  const map = {ok:['ok','sse_ok'], err:['err','sse_retry'], conn:['','sse_conn']};
  const [cls, key] = map[sseState];
  dot.className = 'dot ' + cls;
  document.getElementById('sse-status').textContent = t(key);
}
es.onopen  = () => { sseState = 'ok';  updateSse(); };
es.onerror = () => { sseState = 'err'; updateSse(); };
es.onmessage = ev => { try { addRow(JSON.parse(ev.data)); } catch(_){} };

const sel = document.getElementById('lang-sel');
const LANG_LABEL = {zh:'中文', en:'English', ko:'한국어', ja:'日本語', es:'Español', fr:'Français'};
LANGS.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = LANG_LABEL[l]; sel.appendChild(o); });
sel.value = lang;
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  sel.value = lang;
  updateSse();
  renderChips(); renderDyn(); renderHealthQuota(); renderWheel();
}
sel.addEventListener('change', () => {
  lang = sel.value;
  localStorage.setItem('mr-lang', lang);
  applyLang();
});

(async () => {
  try {
    const evs = await (await fetch('/api/events?limit=30')).json();
    if (Array.isArray(evs)) evs.forEach(addRow);
  } catch(_){}
})();
applyLang();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
