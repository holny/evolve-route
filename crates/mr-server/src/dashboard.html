<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ModelRoute</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
        --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; padding:16px 20px; }
.topbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.topbar h1 { font-size:17px; }
.sub { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:6px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--amber); display:inline-block; }
.dot.ok { background:var(--green); } .dot.err { background:var(--red); }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
.chip { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2px 10px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
.chip b { color:var(--fg); font-weight:normal; }
.lang-sel { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:12px; padding:3px 8px; font-size:12px; cursor:pointer; }
.grid { display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; align-items:start; }
@media (max-width:1100px){ .grid { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
.card h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.card h2 .note { text-transform:none; letter-spacing:0; opacity:.75; margin-left:6px; }
.card h3 { font-size:11px; color:var(--dim); margin:12px 0 6px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { color:var(--dim); text-align:left; font-weight:normal; padding:4px 6px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:bottom; }
td { padding:4px 6px; border-bottom:1px solid #21262d; vertical-align:top; }
tbody tr:hover { background:#1c2129; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dim2 { color:var(--dim); font-size:11px; }
.badge { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; }
.badge.dead { background:#3d1618; color:var(--red); }
.badge.ok   { background:#12261e; color:var(--green); }
#feed { max-height:520px; overflow-y:auto; }
.feed-ev { border-bottom:1px solid #21262d; padding:3px 0; }
.feed-row { display:flex; gap:8px; padding:2px 0; font-variant-numeric:tabular-nums; cursor:pointer; align-items:baseline; }
.feed-row:hover { background:#1c2129; }
.feed-row .t { color:var(--dim); min-width:60px; font-size:11px; }
.feed-row .m { color:var(--blue); min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed-row .tk { font-size:11px; color:var(--dim); }
.feed-row .ms { margin-left:auto; color:var(--dim); }
.pill { border-radius:10px; padding:0 8px; font-size:11px; }
.feed-path { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; padding:2px 0 1px 2px; font-size:11px; color:var(--dim); }
.feed-group { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; background:var(--card); }
.feed-group-h { display:flex; gap:8px; align-items:baseline; padding:4px 10px; background:#1a2029; cursor:pointer; font-size:11px; color:var(--dim); white-space:nowrap; }
.feed-group-h:hover { color:var(--fg); }
.feed-group-h b { color:var(--fg); font-weight:normal; }
.feed-group-h .cnt { margin-left:auto; font-variant-numeric:tabular-nums; }
.feed-group-b .feed-ev { border-bottom:1px solid #21262d; }
.feed-group-b .feed-ev:last-child { border-bottom:0; }
.pbadge { border-radius:4px; padding:0 6px; background:#1c2431; color:var(--blue); white-space:nowrap; }
.pbadge.explore { color:var(--amber); }
.pbadge.warn { color:var(--red); background:#2d1a1c; }
.pdim { font-variant-numeric:tabular-nums; }
.feed-detail { padding:4px 12px; color:var(--dim); font-size:11px; border-left:2px solid var(--border); margin:3px 0 3px 8px; }
.lk-h { color:var(--blue); margin:6px 0 2px; font-size:11px; }
.lk-v { color:var(--fg); }
table.mx { margin:2px 0 4px; font-size:11px; }
table.mx th { padding:2px 5px; }
table.mx td { padding:2px 5px; border-bottom:1px solid #21262d; text-align:right; font-variant-numeric:tabular-nums; }
table.mx td.mxm { text-align:left; color:var(--blue); cursor:pointer; }
table.mx td.mxm:hover { text-decoration:underline; }
table.mx tr.win td { color:var(--green); }
.mxt { font-weight:bold; }
.wheel-row.hl { animation: hlflash 2s ease-out; }
.wf { margin:4px 0 2px; }
.wf-bar { display:flex; height:14px; border-radius:3px; overflow:hidden; font-size:9px; color:#0d1117; }
.wf-seg { display:flex; align-items:center; justify-content:center; min-width:2px; white-space:nowrap; overflow:hidden; }
.wf-pre { background:#58a6ff; } .wf-dec { background:#d29922; }
.wf-first { background:#3fb950; } .wf-stream { background:#8957e5; }
.wf-legend { display:flex; gap:10px; font-size:10px; color:var(--dim); margin-top:3px; flex-wrap:wrap; }
.wf-dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:middle; }
.wtabs { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.wtab { border:1px solid var(--border); border-radius:10px; padding:1px 10px; font-size:11px; color:var(--dim); cursor:pointer; }
.wtab.on { background:#1c2d45; color:var(--blue); border-color:var(--blue); }
.trend-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px; }
.trend-box { border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
.trend-box h4 { font-size:11px; color:var(--dim); font-weight:normal; margin-bottom:4px; }
.trend-svg { width:100%; height:90px; display:block; }
.trend-legend { display:flex; gap:8px; flex-wrap:wrap; font-size:10px; margin-top:2px; }
.trend-legend span { display:inline-flex; align-items:center; gap:3px; }
.trend-legend i { width:10px; height:3px; border-radius:1px; display:inline-block; }
@keyframes hlflash { 0% { background:#264d2b; } 100% { background:transparent; } }
.wedit { cursor:pointer; border-bottom:1px dashed var(--dim); }
.pw-panel { display:none; margin:6px 0; padding:8px; border:1px solid var(--border); border-radius:6px; }
.pw-panel .pwr { display:flex; gap:6px; align-items:center; margin:3px 0; }
.pw-panel label { min-width:90px; color:var(--dim); font-size:11px; }
.pw-panel input { width:70px; background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
.pw-panel button { background:#1a2029; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:2px 10px; cursor:pointer; }
.la { font-size:10px; padding:0 4px; border-radius:3px; margin-left:4px; }
.la.c { background:#12261e; color:var(--green); }
.la.f { background:#3d1618; color:var(--red); }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1 data-i18n="title">ModelRoute 路由面板</h1>
    <div class="sub"><span class="dot" id="sse-dot"></span><span id="sse-status" data-i18n="sse_conn">SSE 连接中…</span></div>
  </div>
  <div class="chips" id="chips"></div>
  <select class="lang-sel" id="lang-sel"></select>
</header>
<main>
  <section class="card">
    <h2 data-i18n="feed">实时决策流</h2>
    <div id="feed"></div>
  </section>
  <div class="grid">
    <section class="card">
      <h2><span data-i18n="dyn">模型动态</span><span class="note" data-i18n="dyn_note">有流量在前按流量排序，无流量按优先度</span></h2>
      <div class="wtabs" id="dyn-tabs"></div>
      <table id="dyn"><thead></thead><tbody></tbody></table>
      <h3 data-i18n="health">冷却与配额窗口（上游限额头学习）</h3>
      <table id="health"><thead></thead><tbody></tbody></table>
      <table id="quota" style="margin-top:8px"><thead></thead><tbody></tbody></table>
    </section>
    <section class="card">
      <h2 style="display:flex;align-items:center;justify-content:space-between">
        <span data-i18n="wheel">飞轮 · 经验学习与自进化（参与路由决策的因素）</span>
        <button class="lang-btn" id="pw-btn" style="text-transform:none">⚖ <span data-i18n="l_weights">公式权重</span></button>
      </h2>
      <div class="pw-panel" id="pw-panel"></div>
      <table id="wheel"><thead></thead><tbody></tbody></table>
    </section>
  </div>
  <section class="card">
    <h2 style="display:flex;justify-content:space-between;align-items:center">
      <span data-i18n="trends_card">趋势 · 模型性能时间线</span>
      <span class="wtabs" id="trend-tabs"></span>
    </h2>
    <div class="trend-grid" id="trend-grid"><div class="dim2" data-i18n="t_nodata">窗口内暂无样本</div></div>
  </section>
  <section class="card">
    <h2 style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span data-i18n="provider_card">Provider 管理</span>
      <span style="display:flex;gap:6px">
        <button class="lang-btn" id="pv-add-btn" data-i18n="pv_add">+ 新增 Provider</button>
        <button class="lang-btn" id="pv-refresh-all-btn" data-i18n="pv_refresh_all">🔄 全部重拉</button>
      </span>
    </h2>
    <div class="sub" style="margin-bottom:8px" data-i18n="provider_sub">手动维护 provider 凭据 / 档位 / 窗口额度 · 扫描发现自动展示</div>
    <div id="providers-list"></div>
  </section>

  <!-- Provider 编辑抽屉 -->
  <div id="pv-drawer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center">
    <div class="card" style="width:560px;max-width:90vw;max-height:90vh;overflow:auto;padding:16px">
      <h3 id="pv-drawer-title" data-i18n="pv_edit">编辑 Provider</h3>
      <div id="pv-form" style="display:grid;grid-template-columns:1fr 2fr;gap:8px;font-size:13px"></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button class="lang-btn" id="pv-cancel-btn" data-i18n="pv_cancel">取消</button>
        <button class="lang-btn" id="pv-save-btn" data-i18n="pv_save">保存</button>
        <button class="lang-btn" id="pv-refresh-btn" data-i18n="pv_refresh">🔄 拉取</button>
        <button class="lang-btn" id="pv-delete-btn" data-i18n="pv_delete" style="border-color:var(--red);color:var(--red)">删除</button>
      </div>
    </div>
  </div>
</main>
<script>
const LANGS = ['zh','en','ko','ja','es','fr'];
let lang = localStorage.getItem('mr-lang');
if (!LANGS.includes(lang)) lang = 'zh';
const LOCALE = {zh:'zh-CN', en:'en-US', ko:'ko-KR', ja:'ja-JP', es:'es-ES', fr:'fr-FR'};

const T = {
  title:     {zh:'ModelRoute 路由面板', en:'ModelRoute Dashboard', ko:'ModelRoute 대시보드', ja:'ModelRoute ダッシュボード', es:'Panel de ModelRoute', fr:'Tableau de bord ModelRoute'},
  sse_conn:  {zh:'SSE 连接中…', en:'SSE connecting…', ko:'SSE 연결 중…', ja:'SSE 接続中…', es:'Conectando SSE…', fr:'Connexion SSE…'},
  sse_ok:    {zh:'SSE 已连接', en:'SSE connected', ko:'SSE 연결됨', ja:'SSE 接続済み', es:'SSE conectado', fr:'SSE connecté'},
  sse_retry: {zh:'SSE 重连中…', en:'SSE reconnecting…', ko:'SSE 재연결 중…', ja:'SSE 再接続中…', es:'Reconectando SSE…', fr:'Reconnexion SSE…'},
  feed:      {zh:'实时决策流', en:'Live decisions', ko:'실시간 결정 스트림', ja:'リアルタイム決定ストリーム', es:'Flujo de decisiones', fr:'Flux de décisions'},
  dyn:       {zh:'模型动态', en:'Model activity', ko:'모델 동향', ja:'モデル動向', es:'Actividad de modelos', fr:'Activité des modèles'},
  dyn_note:  {zh:'有流量在前按流量排序，无流量按优先度', en:'with traffic first by reqs, then by priority', ko:'트래픽 있는 모델이 앞(요청 수순), 없으면 우선순위순', ja:'トラフィックありを先にリクエスト数順、なしは優先度順', es:'con tráfico primero por solicitudes, luego por prioridad', fr:'avec trafic d\'abord par requêtes, puis par priorité'},

  wheel:     {zh:'飞轮 · 经验学习与自进化（参与路由决策的因素）', en:'Flywheel · learned signals that feed routing', ko:'플라이휠 · 경험 학습과 자기 진화(라우팅 판단에 참여)', ja:'フライホイール · 経験学習と自己進化（ルーティング判断に参与）', es:'Volante · aprendizaje que alimenta el enrutamiento', fr:'Volant · apprentissage nourrissant le routage'},
  noflow:    {zh:'暂无流量', en:'no traffic yet', ko:'트래픽 없음', ja:'トラフィックなし', es:'sin tráfico aún', fr:'pas de trafic'},
  allnormal: {zh:'全部正常（无异常记录）', en:'all normal (no incidents)', ko:'모두 정상(이상 기록 없음)', ja:'すべて正常（異常記録なし）', es:'todo normal (sin incidentes)', fr:'tout est normal (aucun incident)'},
  noquota:   {zh:'尚未观测到限额头', en:'no rate-limit headers observed yet', ko:'아직 레이트 리밋 헤더 관찰 안 됨', ja:'まだレート制限ヘッダーは観測なし', es:'aún sin cabeceras de límite', fr:'pas encore d\'en-têtes de limite'},
  wheelcold: {zh:'飞轮经验积累中…', en:'flywheel warming up…', ko:'플라이휠 경험 축적 중…', ja:'フライホイール経験蓄積中…', es:'volante acumulando experiencia…', fr:'volant en accumulation d\'expérience…'},

  translated:{zh:'协议翻译', en:'protocol translated', ko:'프로토콜 번역', ja:'プロトコル翻訳', es:'protocolo traducido', fr:'protocole traduit'},
  skipped:   {zh:'降级链', en:'fallback chain', ko:'폴백 체인', ja:'フォールバック連鎖', es:'cadena de reserva', fr:'chaîne de repli'},
  c_model:  {zh:'模型', en:'Model', ko:'모델', ja:'モデル', es:'Modelo', fr:'Modèle'},
  c_source: {zh:'来源', en:'Source', ko:'출처', ja:'ソース', es:'Fuente', fr:'Source',

  c_lat:    {zh:'平均耗时', en:'avg latency', ko:'평균 지연', ja:'平均時間', es:'latencia prom', fr:'latence moy',

  c_rate:   {zh:'平均tok/s', en:'avg tok/s', ko:'평균 tok/s', ja:'平均tok/s', es:'tok/s prom', fr:'tok/s moy',

  c_tools:  {zh:'工具%', en:'Tools%', ko:'도구%', ja:'ツール%', es:'Herram%', fr:'Outils%',
    _t:{zh:'工具调用 valid_json 占比', en:'tool calls with valid JSON', ko:'도구 호출 valid_json 비율', ja:'ツール呼び出し valid_json 比率', es:'llamadas con JSON válido', fr:'appels avec JSON valide'}},
  c_mk:     {zh:'模型×key', en:'Model×key', ko:'모델×키', ja:'モデル×キー', es:'Modelo×key', fr:'Modèle×clé'},

  c_detail: {zh:'详情/冷却', en:'Detail/Cooldown', ko:'상세/쿨다운', ja:'詳細/クールダウン', es:'Detalle/Enfriamiento', fr:'Détail/Refroidissement'},
  c_window: {zh:'窗口', en:'Window', ko:'윈도우', ja:'ウィンドウ', es:'Ventana', fr:'Fenêtre'},

  w_bench:  {zh:'榜单c/r/a', en:'Bench c/r/a', ko:'벤치 c/r/a', ja:'指標 c/r/a', es:'Bench c/r/a', fr:'Bench c/r/a',
    _t:{zh:'能力先验 coding/reasoning/agentic（0-100%）：配置了外部榜单源时显示榜单学习覆盖值，否则显示目录/发现层先验基线；作为评分的能力项参与路由', en:'capability priors coding/reasoning/agentic (0-100%): shows learned benchmark overlay when configured, otherwise the catalog/discovery prior baseline; feeds the capability term of scoring', ko:'능력 사전 coding/reasoning/agentic(0-100%): 벤치 오버레이가 설정되면 학습값, 없으면 카탈로그/발견 기본값, 점수의 능력 항목에 사용', ja:'能力事前値 coding/reasoning/agentic（0-100%）：ベンチ学習の上書きがあれば優先、なければカタログ/発見の基準値。スコアの能力項に使用', es:'priors de capacidad coding/reasoning/agentic (0-100%): muestra la superposición de benchmarks si está configurada, si no la base del catálogo/descubrimiento; alimenta el término de capacidad', fr:'a priori de capacité coding/reasoning/agentic (0-100%) : affiche la surcouche benchmark si configurée, sinon la base catalogue/découverte ; alimente le terme de capacité du score'}},
  w_rel:    {zh:'rel', en:'rel', ko:'rel', ja:'rel', es:'rel', fr:'rel',
    _t:{zh:'实测可靠性，归一化 0-100（50=基线 0.5）：传输成功率 × 工具调用质量，再按会话确认与插件反馈融合', en:'observed reliability, normalized 0-100 (50 = baseline 0.5): transport success × tool-call quality, fused with session/plugin feedback', ko:'실측 신뢰성, 0-100 정규화(50=기준 0.5): 전송 성공률 × 도구 품질, 세션·플러그인 피드백 융합', ja:'実測信頼性、0-100 正規化（50=基準 0.5）：転送成功率 × ツール品質、セッション確認と融合', es:'fiabilidad observada, normalizada 0-100 (50 = base 0.5): éxito de transporte × calidad de herramientas, fusionada con feedback', fr:'fiabilité observée, normalisée 0-100 (50 = base 0.5) : succès transport × qualité outils, fusionnée avec le feedback'}},
  w_calib:  {zh:'calib', en:'calib', ko:'calib', ja:'calib', es:'calib', fr:'calib',
    _t:{zh:'token 校准，归一化 0-100（50=系数 1.0，>50 表示实际用量比估算偏多）：实际 ÷ 估算 prompt tokens（≥5 样本学习），用于上下文窗口硬约束', en:'token calibration, normalized 0-100 (50 = factor 1.0, >50 means actual runs above estimate): actual ÷ estimated prompt tokens, learned at ≥5 samples, hard constraint for the context window', ko:'토큰 캘리브레이션, 0-100(50=계수 1.0, >50 실제 사용량 많음): 실제 ÷ 추정 프롬프트 토큰, ≥5 샘플 학습, 컨텍스트 윈도우 제약용', ja:'トークン較正、0-100（50=係数 1.0、>50 は実使用が推定超）：実際 ÷ 推定プロンプトトークン、≥5サンプルで学習、コンテキスト窓の硬制約用', es:'calibración de tokens, normalizada 0-100 (50 = factor 1.0, >50 uso por encima del estimado): real ÷ estimado, aprendido con ≥5 muestras, restricción dura de ventana', fr:'calibrage des jetons, normalisé 0-100 (50 = facteur 1.0, >50 usage au-dessus de l\'estimé) : réel ÷ estimé, appris à ≥5 échantillons, contrainte dure de fenêtre'}},
  w_speed:  {zh:'speed', en:'speed', ko:'speed', ja:'speed', es:'speed', fr:'speed',
    _t:{zh:'实测速度，归一化 0-100（50=基线 0.5）：目录先验 7 : 真实请求观测 3 混合，随时间对数衰减', en:'observed speed, normalized 0-100 (50 = baseline 0.5): catalog prior 7 : real-request observation 3 blend, log decay over time', ko:'실측 속도, 0-100(50=기준 0.5): 카탈로그 사전 7 : 실제 관측 3 혼합, 시간 로그 감쇠', ja:'実測速度、0-100（50=基準 0.5）：カタログ事前 7 : 実リクエスト観測 3 混合、時間で対数減衰', es:'velocidad observada, normalizada 0-100 (50 = base 0.5): priori de catálogo 7 : observación real 3, decaimiento log', fr:'vitesse observée, normalisée 0-100 (50 = base 0.5) : priori catalogue 7 : observation réelle 3, décroissance log'}},
  w_bias:   {zh:'bias', en:'bias', ko:'bias', ja:'bias', es:'bias', fr:'bias',
    _t:{zh:'学习偏置，归一化 0-100（50=与目录中位持平，>50 优于中位）：实际成功率相对目录中位数比值（原始 0.7-1.3），表现好上浮、翻车下沉', en:'learned bias, normalized 0-100 (50 = at catalog median, >50 outperforms): actual success vs catalog median ratio (raw 0.7-1.3), rises with good performance, sinks on failures', ko:'학습 편향, 0-100(50=카탈로그 중앙값, >50 중위 초과): 실제 성공률 ÷ 중앙값(원래 0.7-1.3), 좋으면 상승·실패 시 하락', ja:'学習バイアス、0-100（50=カタログ中央値一致、>50 は中央値超）：実成功率 ÷ 中央値（元 0.7-1.3）、好調で上昇・失敗で低下', es:'sesgo aprendido, normalizado 0-100 (50 = mediana del catálogo, >50 supera): éxito real vs mediana (crudo 0.7-1.3), sube si va bien, baja si falla', fr:'biais appris, normalisé 0-100 (50 = médiane du catalogue, >50 surpasse) : succès réel vs médiane (brut 0.7-1.3), monte si performant, descend sinon'}},
  w_sr:     {zh:'成功率', en:'Succ%', ko:'성공률', ja:'成功率', es:'Éxito%', fr:'Succ%',
    _t:{zh:'传输成功率（≥5 样本后显示）', en:'transport success rate (≥5 samples)', ko:'전송 성공률(≥5 샘플)', ja:'転送成功率（≥5サンプル）', es:'tasa de éxito (≥5 muestras)', fr:'taux de succès (≥5 échantillons)'}},
  w_cache:  {zh:'缓存%', en:'Cache%', ko:'캐시%', ja:'ｷｬｯｼｭ%', es:'Caché%', fr:'Cache%',
    _t:{zh:'缓存命中率 = 缓存 tokens ÷ prompt tokens', en:'cache hit rate = cached ÷ prompt tokens', ko:'캐시 적중률 = 캐시 토큰 ÷ 프롬프트 토큰', ja:'命中率 = キャッシュ ÷ プロンプトトークン', es:'tasa de acierto = caché ÷ prompt', fr:'taux de succès = cache ÷ prompt'}},
  w_cost:   {zh:'费用', en:'Cost', ko:'비용', ja:'費用', es:'Coste', fr:'Coût',

    _t:{zh:'飞轮样本量（请求数），学习项达 5 样本后生效（冷启动保护）', en:'flywheel sample size; learning kicks in at 5', ko:'플라이휠 샘플 수(요청 수), 학습은 5 샘플부터(콜드스타트 보호)', ja:'サンプル数（リクエスト数）、学習は5サンプルから（コールドスタート保護）', es:'muestras del volante; el aprendizaje inicia en 5', fr:'échantillons du volant; l\'apprentissage démarre à 5'}},

    _t:{zh:'插件上报的工具执行反馈 ok/total（L4 最高精度信号）', en:'plugin-reported tool feedback ok/total (L4)', ko:'플러그인 보고 도구 실행 피드백 ok/total(L4 최고 정밀 신호)', ja:'プラグイン報告のツール実行フィードバック ok/total（L4）', es:'feedback de herramientas del plugin ok/total (L4)', fr:'retour d\'exécution des outils du plugin ok/total (L4)'}},

    _t:{zh:'最终权重 = 用户 weight × 学习偏置，开方软化后乘入评分', en:'final weight = user weight × learned bias, sqrt-softened into score', ko:'최종 가중치 = 사용자 weight × 학습 편향, 제곱근 완화 후 점수에 곱', ja:'最終重み = ユーザーweight × 学習バイアス、平方根緩和してスコアに乗算', es:'peso final = peso usuario × sesgo, suavizado con raíz', fr:'poids final = poids utilisateur × biais, adouci par racine'}},
  p_sticky: {zh:'粘性复用', en:'sticky reuse', ko:'스티키 재사용', ja:'スティキー再利用', es:'reutilización sticky', fr:'réutilisation sticky'},
  p_sticky_hint: {zh:'粘性复用的全部条件（任一不满足即重新完整评估）：①上轮任务难度低(L1/L2) ②同会话连续 ③窗口装得下 ④服务健康 ⑤配额充足 ⑥量级双向2倍内 ⑦工具未变 ⑧轮次未耗尽(默认2轮)', en:'sticky reuse requires ALL of: previous task low-difficulty (L1/L2), same session, fits in window, service healthy, quota sufficient, size within 2x, same tools, turns remaining — otherwise full re-evaluation', ko:'스티키 재사용 전부 충족 시: 이전 작업 저난이도(L1/L2), 동일 세션, 윈도우 적합, 헬스, 쿼터, 크기 2배 내, 도구 동일, 잔여 턴 — 하나라도 불일치 시 전체 재평가', ja:'スティキー再利用の全条件（一つでも崩れると完全再評価）：前タスク低難度(L1/L2)、同一セッション、窓に収まる、ヘルス正常、クォータ十分、量級2倍内、ツール不変、残ターンあり', es:'la reutilización sticky exige TODO: tarea anterior de baja dificultad (L1/L2), misma sesión, cabe en ventana, servicio sano, cuota suficiente, tamaño dentro de 2x, mismas herramientas, turnos restantes — si no, reevaluación completa', fr:'la réutilisation sticky exige TOUT : tâche précédente de faible difficulté (L1/L2), même session, tient dans la fenêtre, service sain, quota suffisant, taille dans 2x, mêmes outils, tours restants — sinon réévaluation complète'},
  p_explore: {zh:'探索', en:'exploring', ko:'탐색', ja:'探索', es:'explorando', fr:'exploration'},
  t_explore: {zh:'ε-greedy：10% 请求改用次优模型，采集对比样本（高危/hard 任务不探索）', en:'ε-greedy: 10% of requests try the runner-up for comparative samples (skipped on high-stakes)', ko:'ε-greedy: 요청의 10%가 차점 모델 시험(고위험 제외)', ja:'ε-greedy: リクエストの10%で次点モデルを試行（高リスクは除外）', es:'ε-greedy: 10% prueban el segundo modelo (alto riesgo excluido)', fr:'ε-greedy: 10% des requêtes essaient le 2e (haut risque exclu)'},
  p_funnel:  {zh:'漏斗', en:'funnel', ko:'퍼널', ja:'ファネル', es:'embudo', fr:'entonnoir'},
  t_funnel:  {zh:'漏斗四层：目录 {a} → 候选 {b}（硬检查：健康/凭据/上下文窗口/配额）→ 合格 {c}（质量底线随难度提高）→ 评分 {d}（综合排序选出首选）', en:'funnel, 4 stages: catalog {a} → candidates {b} (hard checks: health/credentials/context window/quota) → eligible {c} (quality floor rises with difficulty) → scored {d} (composite ranking picks the top)', ko:'퍼널 4단계: 카탈로그 {a} → 후보 {b}(하드 체크: 헬스/자격/윈도우/쿼터) → 적격 {c}(품질 기준은 난이도에 비례) → 점수 {d}(종합 정렬로 선택)', ja:'ファネル4段階：カタログ {a} → 候補 {b}（ハードチェック：ヘルス/認証/窓/クォータ）→ 適格 {c}（品質基準は難度に連動）→ スコア {d}（総合ソートで選出）', es:'embudo de 4 etapas: catálogo {a} → candidatos {b} (controles duros: salud/credenciales/ventana/cuota) → aptos {c} (el piso de calidad sube con la dificultad) → puntuados {d} (el orden compuesto elige al primero)', fr:'entonnoir à 4 étages : catalogue {a} → candidats {b} (contrôles durs : santé/identifiants/fenêtre/quota) → aptes {c} (plancher de qualité selon la difficulté) → notés {d} (le classement composite choisit le 1er)'},
  t_diff:    {zh:'任务难度 0-3：由判定器（决策模型+规则）评估请求复杂度，随会话深度略增。用途：难度越高质量底线越高（弱模型先出局）、≥2 取消 ε 探索、影响评分权重', en:'task difficulty 0-3, judged by the decision model + rules, rises slightly with session depth. Used for: higher quality floor at higher difficulty (weak models drop first), no ε-exploration at ≥2, and scoring weights', ko:'작업 난이도 0-3: 결정 모델+규칙이 평가, 세션 깊이에 따라 소폭 증가. 용도: 난이도가 높을수록 품질 기준 상승(약한 모델 먼저 탈락), ≥2면 ε 탐색 중단, 점수 가중치 영향', ja:'タスク難度 0-3：判断モデル＋規則がリクエスト複雑度を評価、セッション深度で微増。用途：難度が高いほど品質基準上昇（弱いモデルから脱落）、≥2でε探索中止、スコア重みに影響', es:'dificultad de la tarea 0-3, evaluada por el modelo de decisión + reglas, sube algo con la profundidad de la sesión. Usos: a más dificultad, más piso de calidad (los débiles caen primero), sin exploración ε si ≥2, afecta los pesos', fr:'difficulté de tâche 0-3, évaluée par le modèle de décision + règles, augmente un peu avec la profondeur de session. Usages : difficulté plus haute ⇒ plancher plus haut (les faibles sortent d\'abord), pas d\'exploration ε si ≥2, influence les poids'},
  p_alt:     {zh:'备选', en:'runner-ups', ko:'차점', ja:'次点', es:'alternos', fr:'alternatives'},
  p_diff:    {zh:'难度', en:'difficulty', ko:'난이도', ja:'難度', es:'dificultad', fr:'difficulté'},
  p_est:     {zh:'预估入', en:'est in', ko:'추정 입', ja:'推定入', es:'ent est.', fr:'entr est.'},
  t_est:     {zh:'请求发出前的输入 tokens 估算（用于窗口/配额/粘性检查）；行内「入」是上游实报用量，两者可能不同', en:'input-token estimate made before the request (drives window/quota/sticky checks); the in/out in the row are actual usage reported by upstream and may differ', ko:'요청 전 입력 토큰 추정(윈도우/쿼터/스티키 검사용); 행의 입/출은 업스트림 실제 사용량으로 다를 수 있음', ja:'リクエスト前の入力トークン推定（窓/クォータ/スティキー検査用）；行内の入/出は上流の実使用量で異なり得る', es:'estimación de tokens de entrada antes de la solicitud (ventana/cuota/sticky); lo in/out de la fila es uso real reportado por el upstream', fr:'estimation des jetons d\'entrée avant la requête (fenêtre/quota/sticky) ; le entr/sort de la ligne est l\'usage réel remonté, qui peut différer'},
  t_actual:  {zh:'入=上游实报的总输入 tokens（读是其中命中缓存、按折扣计价的部分；写=新增缓存计费；出=补全）。入的大小由发送内容决定：全新短请求几十 token、带全部历史的长会话几十万都正常', en:'in = total input tokens reported by upstream (r = the cached subset, billed at discount; w = new cache written, billed; out = completion). Size follows content: a fresh short request is tens of tokens, a long session with full history is hundreds of thousands', ko:'입=업스트림이 보고한 총 입력 토큰(읽=그중 캐시 적중 부분, 할인 과금; 쓰=신규 캐시 기록, 과금; 출=보완). 크기는 내용에 비례: 새 짧은 요청은 수십 토큰, 전체 히스토리를 실Long 세션은 수십만', ja:'入=上流が報告する総入力トークン（読=うちキャッシュ適中部分、割引課金；書=新規キャッシュ書き込み、課金；出=補完）。大きさは内容次第：全新の短いリクエストは数十トークン、全履歴を含む長いセッションは数十万', es:'ent = total de tokens de entrada reportados por el upstream (lee = parte en caché, con descuento; esc = caché nueva, facturada; sal = complementación). El tamaño sigue al contenido: una petición corta nueva son decenas de tokens, una sesión larga con historial son cientos de miles', fr:'entr = total des jetons d\'entrée remontés (lect = partie en cache, facturée au rabais ; éc = cache nouvelle, facturée ; sor = complétion). La taille suit le contenu : une requête courte neuve fait des dizaines de jetons, une longue session avec historique en fait des centaines de milliers'},
  s_incl: {zh:'其中读', en:'incl. r', ko:'이중 읽', ja:'内 読', es:'incl. lee', fr:'dont lect'},
  f_cache_util: {zh:'缓存利用', en:'cache util', ko:'캐시 활용', ja:'ｷｬｯｼｭ利用', es:'uso caché', fr:'util. cache'},
  t_cache_util: {zh:'缓存利用率 = 缓存读 ÷ 总输入 tokens（读是入的子集，折扣计价；越高越省钱）', en:'cache utilisation = cached read ÷ total input tokens (read is a subset of input, billed at discount; higher is cheaper)', ko:'캐시 활용률 = 캐시 읽기 ÷ 총 입력 토큰(읽은 입력의 부분집합, 할인; 높을수록 저렴)', ja:'キャッシュ利用率 = キャッシュ読み ÷ 総入力トークン（読みは入力の部分集合、割引。高いほど安い）', es:'uso de caché = lectura caché ÷ total de tokens de entrada (la lectura es subconjunto de la entrada, con descuento; más alto es más barato)', fr:'utilisation du cache = lecture cache ÷ total des jetons d\'entrée (la lecture fait partie de l\'entrée, au rabais ; plus haut = moins cher)'},
  f_tools:   {zh:'工具', en:'tools', ko:'도구', ja:'ツール', es:'herram.', fr:'outils'},
  f_entries: {zh:'条', en:'entries', ko:'건', ja:'件', es:'reg.', fr:'entrées'},

const t = k => (T[k] && (T[k][lang] ?? T[k].zh)) ?? k;

const feed = document.getElementById('feed');
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtK(n){ return n==null ? '-' : (n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1000 ? (n/1000).toFixed(1)+'k' : String(n)); }
function fmtCost(n, cur){ if (n==null) return '-'; const sym = cur==='CNY' ? '¥' : '$'; return sym + (n>=100 ? n.toFixed(0) : n.toFixed(n<1 ? 3 : 2)); }
function fmtMs(ms){ return ms==null ? '-' : (ms>=10000 ? (ms/1000).toFixed(0)+'s' : ms>=1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms'); }
function fmtRate(r){ return r==null ? '-' : r.toFixed(1); }
function timeStr(d){ return d.toLocaleTimeString(LOCALE[lang], {hour12:false}); }
function feedTokens(e){
  let s = fmtK(e.prompt_tokens ?? e.est_tokens)+t('s_in')+' '+fmtK(e.completion_tokens ?? 0)+t('s_out');
  if (e.cached_tokens)      s += ' · '+t('s_incl')+fmtK(e.cached_tokens);
  if (e.cache_write_tokens) s += ' · '+t('s_write')+fmtK(e.cache_write_tokens);
  return s;
}

function judgeBadge(e){
  const map = {'decision_model':'bj_model', 'decision_model+rules':'bj_hybrid', 'heuristic':'bj_heur', 'explicit':'bj_explicit'};
  const k = map[e.judge];
  return k ? '<span class="pbadge" title="'+esc(t('t_'+k))+'">'+esc(t(k))+'</span>' : '';
}
function decisionPath(e){
  const parts = [];
  if (e.skipped) parts.push('<span class="pbadge warn" title="'+t('skipped')+'">↩ '+esc(e.skipped)+'</span>');
  if (e.sticky) {
    parts.push('<span class="pbadge" title="'+esc(t('p_sticky_hint'))+'">'+esc(t('p_sticky'))+'</span>');
  } else {
    parts.push(judgeBadge(e));
    if ((e.reason||'').includes('[exploring]'))
      parts.push('<span class="pbadge explore" title="'+esc(t('t_explore'))+'">'+esc(t('p_explore'))+'</span>');
    const f = e.funnel || [];
    if (f.length === 4 && f.some(x => x > 0)) {
      const tip = t('t_funnel').replace('{a}',f[0]).replace('{b}',f[1]).replace('{c}',f[2]).replace('{d}',f[3]);
      parts.push('<span class="pdim" title="'+esc(tip)+'">'+esc(t('p_funnel'))+' '+f.join('→')+'</span>');
    }
    if (e.difficulty_eff != null)
      parts.push('<span class="pdim" title="'+esc(t('t_diff'))+'">'+esc(t('p_diff'))+' '+(+e.difficulty_eff).toFixed(1)+'</span>');
  }
  const alts = (e.chain || []).filter(m => m !== e.chosen).slice(0, 2);
  if (alts.length) parts.push('<span class="pdim" title="'+esc(t('p_alt'))+'">'+esc(t('p_alt'))+' '+alts.map(a => esc(a.length>22?a.slice(0,21)+'…':a)).join(' ▸ ')+'</span>');
  if (e.est_tokens) parts.push('<span class="pdim" title="'+esc(t('t_est'))+'">'+esc(t('p_est'))+' '+fmtK(e.est_tokens)+' tok</span>');
  return parts.join('');
}
function shortId(m){ return m.length>26 ? m.slice(0,25)+'…' : m; }
function causeLocal(c){
  const paren = s => lang==='zh'||lang==='ja'||lang==='ko' ? '（'+s+'）' : '('+s+')';
  let m;
  if (c === 'no credential') return t('ca_cred');
  if (c === 'no vision support') return t('ca_vision');
  if (c === 'context window too small') return t('ca_window');
  if ((m = c.match(/^unknown context window \(proven max accepted (\d+) tok\)$/)))
    return t('ca_proven').replace('{n}', fmtK(+m[1]));
  if ((m = c.match(/^quota remaining (\d+) < est (\d+)$/)))
    return t('ca_quota').replace('{a}', fmtK(+m[1])).replace('{b}', fmtK(+m[2]));
  if ((m = c.match(/^(auth failed|no credit|quota exhausted|rate limited|model unsupported|context overflow|transient error)(?: for (\d+)s)? \((.*)\)$/))) {
    const hk = T['hk_'+m[1].replace(/ /g,'_')];
    let s = hk ? (hk[lang] ?? hk.zh) : m[1];
    if (m[2]) s += ' · ' + t('ca_cooldown').replace('{n}', m[2]);
    return s + paren(m[3]);
  }
  return c;
}
function decisionDetail(e){
  const L = [];
  L.push('<b>'+esc(t('st_why'))+' '+esc(shortId(e.chosen))+(lang==='zh'?'？':'?')+'</b>');
  L.push(waterfallBar(e));
  L.push(linkView(e));
  if (e.sticky) {
    push2(L, esc(t('st_sticky_1')));
    push2(L, esc(t('st_sticky_2').replace('{n}', fmtK(e.est_tokens||e.prompt_tokens||0))));
    push2(L, esc(t('st_sticky_3')));
  } else {
    const bym = {'decision_model':'st_by_model', 'decision_model+rules':'st_by_hybrid', 'heuristic':'st_by_heur', 'explicit':'st_by_explicit'}[e.judge];
    if (bym) push2(L, esc(t(bym)));
    const dm = (e.reason||'').match(/domain=(\w+)/);
    if (dm) {
      const dk = T['dom_'+dm[1]];
      const diff = +e.difficulty_eff || 0;

function waterfallBar(e){

    'title="'+esc(sg.label)+' '+fmtMs(sg.ms)+'">'+(100*sg.ms/total2 > 14 ? fmtMs(sg.ms) : '')+'</span>').join('');

    '<span style="margin-left:auto">'+esc(t('w_total'))+' '+fmtMs(total2)+'</span></span>';

function feedMetrics(e){

function groupBlock(e){

    feedMetrics(e) +

    '<div class="feed-path">'+decisionPath(e)+'</div>' +
    '<div class="feed-detail" style="display:none">'+decisionDetail(e)+'</div>';
  row.querySelector('.feed-row').addEventListener('click', () => {
    const d = row.querySelector('.feed-detail');
    if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  });
  const g = groupBlock(e);
  g.count++;
  g.h.querySelector('.cnt').textContent = g.count+' '+t('f_entries')+' · '+timeStr(new Date());
  g.b.prepend(row);
  lastAct[e.chosen] = {a: badge === 'ok' ? 'c' : 'f', t: Date.now()};
  while (g.b.children.length > 50) { if (g.b.lastChild) g.b.removeChild(g.b.lastChild); }
  while (feed.children.length > 24) {
    const last = feed.lastChild;
    if (!last) break;
    if (last.dataset && last.dataset.key) groups.delete(last.dataset.key);
    feed.removeChild(last);
  }
}

const TREND_COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#8957e5','#39d2c0'];
function trendSvg(series, pick, fmt, y0forced) {
  const W = 260, H = 78, PAD = 4;
  const pts = series.map(s => ({
    model: s.model,
    xy: s.points.map(p => ({ x: p.ts, y: pick(p) })).filter(pt => pt.y != null && isFinite(pt.y)),
  })).filter(s => s.xy.length > 1);
  if (!pts.length) return '<div class="dim2">'+esc(t('t_nodata'))+'</div>';
  const all = pts.flatMap(s => s.xy.map(p => p.y));
  let lo = y0forced != null ? y0forced : Math.min(...all);
  let hi = Math.max(...all);
  if (lo === hi) { hi = lo + 1; }
  const t0 = Math.min(...pts.flatMap(s => s.xy.map(p => p.x)));
  const t1 = Math.max(...pts.flatMap(s => s.xy.map(p => p.x))) || 1;
  const X = x => PAD + ((x - t0) / (t1 - t0)) * (W - 2 * PAD);
  const Y = y => PAD + (1 - (y - lo) / (hi - lo)) * (H - 2 * PAD);
  const lines = pts.map((s, i) => {
    const d = s.xy.map((p, j) => (j ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
    const col = TREND_COLORS[i % TREND_COLORS.length];
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.5"/>' +
      '<text x="'+(W-PAD)+'" y="'+(PAD+8+i*10)+'" text-anchor="end" font-size="8" fill="'+col+'">'+
      esc(shortId(s.model))+'</text>';
  });
  const yLab = v => '<text x="'+(PAD+2)+'" y="'+(Y(v)+3)+'" font-size="8" fill="var(--dim)">'+fmt(v)+'</text>';
  return '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
    '<line x1="'+PAD+'" y1="'+Y(hi)+'" x2="'+(W-PAD)+'" y2="'+Y(hi)+'" stroke="var(--border)" stroke-dasharray="3,3"/>' +
    '<line x1="'+PAD+'" y1="'+Y(lo)+'" x2="'+(W-PAD)+'" y2="'+Y(lo)+'" stroke="var(--border)" stroke-dasharray="3,3"/>' +
    yLab(hi) + yLab(lo) + lines.join('') + '</svg>';
}

es.onerror = () => { sseState = 'err'; updateSse(); };
es.onmessage = ev => { try { addRow(JSON.parse(ev.data)); } catch(_){} };

const sel = document.getElementById('lang-sel');
const LANG_LABEL = {zh:'中文', en:'English', ko:'한국어', ja:'日本語', es:'Español', fr:'Français'};
LANGS.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = LANG_LABEL[l]; sel.appendChild(o); });
sel.value = lang;
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  sel.value = lang;
  updateSse();
  renderChips(); renderDyn(); renderHealthQuota(); renderWheel();
}
sel.addEventListener('change', () => {
  lang = sel.value;
  localStorage.setItem('mr-lang', lang);
  applyLang();
});

(async () => {
  try {
    const evs = await (await fetch('/api/events?limit=30')).json();
    if (Array.isArray(evs)) evs.forEach(addRow);
  } catch(_){}
})();
applyLang();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
