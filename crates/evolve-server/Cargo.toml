[package]
name = "evolve-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "evolve_server"
path = "src/lib.rs"

[[bin]]
name = "evo-router"
path = "src/main.rs"

[dependencies]
evolve-core = { workspace = true }
evolve-decision = { workspace = true }
evolve-memory = { workspace = true }
evolve-discovery = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
bytes = "1"
switchyard-translation = "0.3"
switchyard-protocol = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
