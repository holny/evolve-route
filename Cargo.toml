[workspace]
resolver = "2"
members = [
    "crates/turbine-core",
    "crates/turbine-decision",
    "crates/turbine-memory",
    "crates/turbine-discovery",
    "crates/turbine-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/holny/turbine-router"

[workspace.dependencies]
turbine-core = { path = "crates/turbine-core" }
turbine-decision = { path = "crates/turbine-decision" }
turbine-memory = { path = "crates/turbine-memory" }
turbine-discovery = { path = "crates/turbine-discovery" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-trait = "0.1"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
